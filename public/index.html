<!DOCTYPE html>
<html lang="nb" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0B0C">
<meta name="color-scheme" content="dark light">
<meta name="description" content="BitWise — programmer calculator for bases, bits, bytes and floats.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BitWise">
<title>BitWise</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/ibm-plex-sans-latin-300-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/ibm-plex-sans-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css?v=__BUILD__">
<script>
/* apply the saved theme before first paint so there is no flash */
(function () {
  var p = null;
  try { p = localStorage.getItem("bw.theme"); } catch (e) {}
  var dark = p === "dark" || (p !== "light" && !(window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches));
  document.documentElement.dataset.theme = dark ? "dark" : "light";
})();
</script>
<script type="module" src="js/app.js?v=__BUILD__"></script>
</head>
<body>
<div class="app">

<header class="top">
  <div class="brand">
    <span class="brand__mark" aria-hidden="true">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2" class="off"/><rect x="3" y="13" width="8" height="8" rx="2" class="off"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg>
    </span>
    <span class="brand__name">BitWise</span>
    <span class="brand__meta" id="wordLabel">64-bit · usignert</span>
  </div>
  <button class="icon-btn" id="installBtn" hidden data-i18n-aria="a.install">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m0 0l-4.5-4.5M12 15l4.5-4.5M5 20h14"/></svg>
  </button>
  <button class="icon-btn" id="helpBtn" data-i18n-aria="a.help">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.4a2.5 2.5 0 1 1 3.4 2.4c-.7.3-1 .8-1 1.6M12 16.8v.1"/></svg>
  </button>
  <button class="icon-btn" id="settingsBtn" data-i18n-aria="a.settings">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
  </button>
</header>

<main class="main">
  <section class="screen" id="screen">
    <div class="tabs" id="baseSeg" role="tablist" data-i18n-aria="a.base">
      <button class="tabs__btn" role="tab" data-mode="HEX">HEX</button>
      <button class="tabs__btn" role="tab" data-mode="DEC">DEC</button>
      <button class="tabs__btn" role="tab" data-mode="OCT">OCT</button>
      <button class="tabs__btn" role="tab" data-mode="BIN">BIN</button>
      <span class="tabs__bar" aria-hidden="true"></span>
    </div>

    <div class="display" id="swipeZone">
      <div class="disp-inner" id="dispInner">
        <button class="pending" id="pending" hidden data-i18n-aria="a.swap"></button>
        <div class="value" id="mainVal" aria-live="polite">0</div>
        <div class="conv" id="conv"></div>
        <div class="insight" id="insight"></div>
      </div>
    </div>

    <div class="meta">
      <div class="seg" id="bitsSeg" role="radiogroup" data-i18n-aria="a.wordSize">
        <span class="seg__ind" aria-hidden="true"></span>
        <button class="seg__btn" role="radio" data-bits="8">8</button>
        <button class="seg__btn" role="radio" data-bits="16">16</button>
        <button class="seg__btn" role="radio" data-bits="32">32</button>
        <button class="seg__btn" role="radio" data-bits="64">64</button>
        <button class="seg__btn" role="radio" data-bits="128">128</button>
      </div>
      <button class="toggle" id="sgn" aria-pressed="false" data-i18n="signed">Signert</button>
    </div>

    <section class="inspect" id="inspect" data-i18n-aria="a.inspector">
      <div class="inspect__head">
        <div class="seg seg--view" id="viewSeg" role="tablist">
          <span class="seg__ind" aria-hidden="true"></span>
          <button class="seg__btn" role="tab" data-view="bits" data-i18n="view.bits">Bits</button>
          <button class="seg__btn" role="tab" data-view="bytes" data-i18n="view.bytes">Bytes</button>
          <button class="seg__btn" role="tab" data-view="float" data-i18n="view.float">Flyttall</button>
        </div>
        <button class="toggle toggle--sm" id="fieldBtn" aria-pressed="false" data-i18n="field">Felt</button>
        <button class="toggle toggle--sm" id="endBtn" hidden>BE</button>
        <button class="toggle toggle--sm" id="copyBtn" hidden data-i18n="copy">Kopier</button>
        <span class="spacer"></span>
        <button class="icon-btn icon-btn--flat" id="fold" aria-expanded="false" aria-controls="inspectBody" data-i18n-aria="a.expand">
          <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg>
        </button>
      </div>
      <div class="inspect__body" id="inspectBody"></div>
    </section>
  </section>

  <div class="keys" id="pad"></div>
</main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<div class="update-bar" id="updateBar" hidden>
  <span data-i18n="update.text">En ny versjon av BitWise er klar</span>
  <button class="update-bar__btn" id="updateBtn" data-i18n="update.action">Oppdater</button>
</div>

<div class="hintcard" id="hintcard" hidden role="tooltip">
  <div class="hintcard__title" id="hintKey"></div>
  <div class="hintcard__text" id="hintTxt"></div>
</div>

<dialog class="sheet" id="settings" aria-labelledby="settingsTitle">
  <div class="sheet__grip" aria-hidden="true"></div>
  <header class="sheet__head">
    <h2 id="settingsTitle" data-i18n="settings.title">Innstillinger</h2>
    <button class="icon-btn icon-btn--flat" data-close data-i18n-aria="a.close">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </header>
  <div class="field">
    <div class="field__label" id="themeLbl" data-i18n="settings.theme">Tema</div>
    <div class="seg seg--wide" id="themeSeg" role="radiogroup" aria-labelledby="themeLbl">
      <span class="seg__ind" aria-hidden="true"></span>
      <button class="seg__btn" role="radio" data-theme-pref="auto" data-i18n="settings.theme.auto">System</button>
      <button class="seg__btn" role="radio" data-theme-pref="light" data-i18n="settings.theme.light">Lyst</button>
      <button class="seg__btn" role="radio" data-theme-pref="dark" data-i18n="settings.theme.dark">Mørkt</button>
    </div>
  </div>
  <div class="field">
    <div class="field__label" id="langLbl" data-i18n="settings.lang">Språk</div>
    <div class="seg seg--wide" id="langSeg" role="radiogroup" aria-labelledby="langLbl">
      <span class="seg__ind" aria-hidden="true"></span>
      <button class="seg__btn" role="radio" data-lang-pref="auto" data-i18n="settings.lang.auto">System</button>
      <button class="seg__btn" role="radio" data-lang-pref="nb" lang="nb">Norsk</button>
      <button class="seg__btn" role="radio" data-lang-pref="en" lang="en">English</button>
    </div>
  </div>
  <label class="row">
    <span data-i18n="settings.haptics">Vibrasjon ved tastetrykk</span>
    <input type="checkbox" class="switch" id="hapticsToggle" checked>
  </label>
  <button class="row" id="openGuide">
    <span data-i18n="settings.guide">Åpne veiledningen</span>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
  </button>
  <p class="sheet__foot" id="aboutLine"></p>
</dialog>

<dialog class="sheet sheet--tall" id="help" aria-labelledby="helpTitle">
  <div class="sheet__grip" aria-hidden="true"></div>
  <header class="sheet__head">
    <h2 id="helpTitle" data-i18n="help.title">Slik bruker du BitWise</h2>
    <button class="icon-btn icon-btn--flat" data-close data-i18n-aria="a.close">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </header>
  <div class="help" id="helpBody"></div>
</dialog>

<noscript><p style="padding:24px">BitWise needs JavaScript.</p></noscript>
</body>
</html>
