name: Deploy BitWise to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Stamp build id into the app shell
        run: |
          BUILD="${GITHUB_SHA::7}"
          sed -i "s/__BUILD__/$BUILD/g" public/sw.js public/index.html public/js/app.js
          echo "Build $BUILD"

      - name: Keep the old bitwise-kalkulator.html address working
        run: cp public/index.html public/bitwise-kalkulator.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
