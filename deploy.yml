name: Deploy BitWise to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Stamp build id into sw.js and index.html
        run: |
          BUILD="${GITHUB_SHA::7}"
          sed -i "s/__BUILD__/$BUILD/g" sw.js index.html
          echo "Build $BUILD"

      - name: Copy shared file for the bitwise-kalkulator.html alias
        run: cp index.html bitwise-kalkulator.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
